<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedientes de estancia</title>
<style>
  :root {
    --fondo: #f6f4ef; --tarjeta: #ffffff; --texto: #1f2a24; --suave: #55625a; --linea: #d8d4c8;
    --verde: #1d5c3f; --verde-fondo: #e3f1e9; --ambar: #8a5a00; --ambar-fondo: #fbefd0;
    --rojo: #a12d1b; --rojo-fondo: #fbe3de; --azul: #1f4e79;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #151b17; --tarjeta: #1e2621; --texto: #eef1ec; --suave: #aab5ad; --linea: #36413a;
      --verde: #7fd1a3; --verde-fondo: #1f3a2c; --ambar: #f0c36a; --ambar-fondo: #3b2f12;
      --rojo: #ff9c8a; --rojo-fondo: #43211b; --azul: #8fbbe6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--linea); background: var(--tarjeta); }
  header h1 { font-size: 18px; margin: 0; }
  .modos { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
  .modo { padding: 2px 10px; border-radius: 999px; background: var(--ambar-fondo); color: var(--ambar); }
  .acciones { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section, .caja { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--linea); background: var(--tarjeta); color: var(--texto); cursor: pointer; }
  button.primario { background: var(--verde); color: #fff; border-color: var(--verde); }
  @media (prefers-color-scheme: dark) { button.primario { color: #10251a; } }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, .fila:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
  .fila { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  .fila.activa { border-color: var(--verde); box-shadow: 0 0 0 2px var(--verde-fondo); }
  .chip { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 999px; margin-left: 6px; }
  .ok { background: var(--verde-fondo); color: var(--verde); }
  .aviso { background: var(--ambar-fondo); color: var(--ambar); }
  .critico { background: var(--rojo-fondo); color: var(--rojo); }
  .suave { color: var(--suave); font-size: 14px; }
  .alerta { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; }
  label { display: block; font-size: 14px; color: var(--suave); margin-bottom: 2px; }
  input, select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--linea); border-radius: 6px; background: var(--fondo); color: var(--texto); }
  input.dudoso { border-color: var(--ambar); background: var(--ambar-fondo); color: var(--texto); }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; }
  pre { background: var(--fondo); border: 1px solid var(--linea); border-radius: 8px; padding: 10px; overflow: auto; font-size: 13px; max-height: 260px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  caption { text-align: left; font-weight: 600; padding-bottom: 6px; }
  .pasos { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .error { color: var(--rojo); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Expedientes de estancia</h1>
  <div class="modos" id="modos" aria-label="Modo de cada conexión"></div>
  <div class="acciones">
    <span id="reloj" class="suave"></span>
    <button id="btnReloj" title="Avanza el reloj de la demo para ver las alarmas">Reloj +6 h</button>
    <button id="btnSync" class="primario">Leer reservas de RoomCloud</button>
    <button id="btnOfi" title="Lectura de ejemplo: no se escribe nunca en OfiHotel">Leer OfiHotel (solo lectura)</button>
    <button id="btnReset">Reiniciar</button>
  </div>
</header>
<main>
  <div>
    <section aria-labelledby="hBandeja"><h2 id="hBandeja">Bandeja</h2><div id="bandeja" aria-live="polite"></div></section>
    <section aria-labelledby="hAlertas"><h2 id="hAlertas">Avisos</h2><div id="alertas" aria-live="polite"></div></section>
    <section aria-labelledby="hListado">
      <h2 id="hListado">Listado del día</h2>
      <p class="suave" id="resumenPartes"></p>
      <div id="listado"></div>
    </section>
  </div>
  <div>
    <section aria-labelledby="hOcup">
      <h2 id="hOcup">Ocupación (7 días)</h2>
      <div id="ocupacion"></div>
      <h3>Reserva física (walk-in)</h3>
      <div class="rejilla">
        <div><label for="w_nombre">Nombre</label><input id="w_nombre"></div>
        <div><label for="w_apellidos">Apellidos</label><input id="w_apellidos"></div>
        <div><label for="w_tipo">Tipo de habitación</label><select id="w_tipo"></select></div>
        <div><label for="w_in">Llegada</label><input id="w_in" type="date"></div>
        <div><label for="w_out">Salida</label><input id="w_out" type="date"></div>
      </div>
      <label id="forzarEtiqueta" hidden><input type="checkbox" id="w_forzar" style="width:auto"> Reservar de todos modos (provoca overbooking)</label>
      <div id="errW"></div>
      <button id="btnWalkin">Añadir reserva física</button>
    </section>
    <section aria-labelledby="hWa">
      <h2 id="hWa">Simular WhatsApp entrante</h2>
      <div class="rejilla">
        <div><label for="wa_id">Número (wa_id)</label><input id="wa_id" value="34600111222"></div>
        <div><label for="wa_nombre">Nombre de perfil</label><input id="wa_nombre" value="Ana"></div>
      </div>
      <label for="wa_texto">Mensaje</label>
      <input id="wa_texto" value="Hola, ¿a qué hora es el check-in?">
      <p><button id="btnWa" class="primario">Enviar mensaje simulado</button></p>
    </section>
    <section aria-labelledby="hChat">
      <h2 id="hChat">Chat con la información</h2>
      <div id="chatLog" aria-live="polite"></div>
      <label for="chatTexto">Pregunta</label>
      <input id="chatTexto" placeholder="¿Qué llegadas hay hoy? ¿Cómo está la ocupación?">
      <p><button id="btnChat">Preguntar</button></p>
    </section>
    <div id="detalle"><section><p class="suave">Lee las reservas y elige una llegada.</p></section></div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const NOMBRES = { huesped: "Datos del huésped", pago: "Medio de pago", empresa: "Datos de empresa", parte: "Parte de viajeros",
  ofihotel_alta: "Alta en OfiHotel", factura: "Factura", habitacion_liberada: "Habitación liberada" };
const CAMPOS = [["nombre","Nombre"],["apellido1","Primer apellido"],["apellido2","Segundo apellido"],["sexo","Sexo (H/M)"],
  ["fecha_nacimiento","Nacimiento (AAAA-MM-DD)"],["nacionalidad","Nacionalidad (ISO3)"],["tipo_documento","Tipo (NIF/NIE/PAS)"],
  ["numero_documento","Nº de documento"],["numero_soporte","Nº de soporte"],["direccion","Dirección"],["localidad","Localidad"],
  ["codigo_postal","Código postal"],["pais","País (ISO3)"],["telefono","Teléfono"],["email","Correo"]];
let actual = null, lectura = null;

async function api(ruta, metodo = "GET", cuerpo) {
  const r = await fetch("/api" + ruta, { method: metodo, headers: { "content-type": "application/json" }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw datos.detail || datos;
  return datos;
}
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lista = (e) => Array.isArray(e) ? e : (e.problemas || e.faltan || e.pendientes || [JSON.stringify(e)]);
const errores = (e) => `<p class="error" role="alert">${lista(e).map(esc).join("<br>")}</p>`;

async function pintarEstado() {
  const e = await api("/estado");
  $("#modos").innerHTML = [["RoomCloud", e.roomcloud], ["OCR", e.ocr], ["SES.Hospedajes", e.ses], ["OfiHotel", e.ofihotel]]
    .map(([n, m]) => `<span class="modo">${n}: ${esc(m)}</span>`).join("");
  $("#reloj").textContent = "Reloj de la demo: " + e.reloj.replace("T", " ");
}

function fila(e) {
  const chip = e.estado === "cerrado" ? `<span class="chip ok">cerrado</span>`
    : e.estado === "pendiente_llegada" ? `<span class="chip aviso">pendiente de llegada</span>`
    : e.parte === "hecho" ? `<span class="chip ok">parte enviado</span>`
    : `<span class="chip critico">parte pendiente${e.parte_restante_h != null ? " · " + e.parte_restante_h + " h" : ""}</span>`;
  return `<button class="fila ${actual === e.id ? "activa" : ""}" data-id="${esc(e.id)}"><strong>${esc(e.huesped)}</strong>${chip}<br>
    <span class="suave">${esc(e.checkin)} a ${esc(e.checkout)}${e.viaja_por_trabajo ? " · viaja por trabajo" : ""}</span></button>`;
}

async function pintarPanel() {
  const p = await api("/panel");
  $("#alertas").innerHTML = p.alertas.length ? p.alertas.map((a) => `<div class="alerta ${a.nivel}">${esc(a.texto)}</div>`).join("") : `<p class="suave">Sin avisos.</p>`;
  $("#resumenPartes").textContent = `Partes enviados: ${p.partes.enviados} · pendientes: ${p.partes.pendientes}`;
  const bloque = (t, l) => l.length ? `<h3>${t}</h3>${l.map(fila).join("")}` : "";
  $("#listado").innerHTML = bloque("Llegadas de hoy", p.llegadas_hoy) + bloque("En casa", p.en_casa) + bloque("Salidas de hoy", p.salidas_hoy) || `<p class="suave">Nada previsto hoy.</p>`;
  document.querySelectorAll(".fila").forEach((b) => b.onclick = () => abrir(b.dataset.id));
  await pintarEstado();
  await pintarBandeja();
  await pintarOcupacion();
}

async function pintarBandeja() {
  const b = await api("/bandeja");
  const pendientes = b.propuestas.map((p) => `<div class="alerta aviso"><strong>${esc(p.texto)}</strong><br>
    <span class="suave">${esc(p.destino)} · propuesta por ${esc(p.origen)}${p.destinatario ? " · a " + esc(p.destinatario) : ""}</span><br>
    <button class="primario" data-aprobar="${esc(p.id)}">Aprobar</button> <button data-rechazar="${esc(p.id)}">Rechazar</button></div>`).join("");
  const eventos = b.eventos.slice(0, 30).map((e) => `<tr><td>${esc(e.ts.slice(11))}<br><span class="suave">${esc(e.fuente)}</span></td>
    <td><strong>${esc(e.remitente)}</strong> ${esc((e.contenido || "").slice(0, 140))}${e.expediente_id ? ` <button data-exp="${esc(e.expediente_id)}">ver</button>` : ""}</td></tr>`).join("");
  $("#bandeja").innerHTML = `<h3>Pendientes de aprobar (${b.propuestas.length})</h3>${pendientes || `<p class="suave">Nada pendiente.</p>`}<div id="errB"></div>
    <h3>Lo último que ha llegado</h3><table><caption class="suave">Hora y fuente, remitente y contenido</caption>${eventos}</table>`;
  const decidir = (ruta) => async (ev) => {
    try { await api("/propuestas/" + ev.target.dataset[ruta === "aprobar" ? "aprobar" : "rechazar"] + "/" + ruta, "POST", { actor: "Flor" }); pintarPanel(); if (actual) abrir(actual); }
    catch (e) { $("#errB").innerHTML = errores(e); }
  };
  document.querySelectorAll("[data-aprobar]").forEach((x) => x.onclick = decidir("aprobar"));
  document.querySelectorAll("[data-rechazar]").forEach((x) => x.onclick = decidir("rechazar"));
  document.querySelectorAll("#bandeja [data-exp]").forEach((x) => x.onclick = () => abrir(x.dataset.exp));
}

async function pintarOcupacion() {
  const d = await api("/disponibilidad");
  const m = d.mapa;
  const celdas = (t) => m.tipos[t].dias.map((c) => {
    const clase = c.ocupadas > m.tipos[t].capacidad ? "critico" : c.ocupadas === m.tipos[t].capacidad ? "aviso" : "ok";
    return `<td><span class="chip ${clase}" title="${c.ocupadas} ocupadas de ${m.tipos[t].capacidad}">${c.libres}</span>${c.cerrado_en_roomcloud ? ` <span class="suave" title="Cerrado en RoomCloud">cerrado</span>` : ""}</td>`;
  }).join("");
  $("#ocupacion").innerHTML = `<table><caption class="suave">Habitaciones libres por tipo y día (negativo = overbooking)</caption>
    <tr><th scope="col">Tipo</th>${m.fechas.map((f) => `<th scope="col">${esc(f.slice(5))}</th>`).join("")}</tr>
    ${Object.keys(m.tipos).map((t) => `<tr><th scope="row">${esc(t)}</th>${celdas(t)}</tr>`).join("")}</table>`;
  const sel = $("#w_tipo");
  if (!sel.options.length) sel.innerHTML = Object.keys(m.tipos).map((t) => `<option>${esc(t)}</option>`).join("");
  if (!$("#w_in").value) {
    const hoy = m.fechas[0], manana = new Date(hoy + "T00:00:00Z"); manana.setUTCDate(manana.getUTCDate() + 1);
    $("#w_in").value = hoy; $("#w_out").value = manana.toISOString().slice(0, 10);
  }
}

function formHuesped(campos, confianza = {}) {
  return `<div class="rejilla">${CAMPOS.map(([c, et]) => {
    const dudoso = confianza[c] !== undefined && confianza[c] < 0.85 ? "dudoso" : "";
    return `<div><label for="h_${c}">${et}${dudoso ? " (revisar)" : ""}</label><input id="h_${c}" class="${dudoso}" value="${esc(campos[c])}"></div>`;
  }).join("")}</div>`;
}

async function abrir(id) {
  actual = id; lectura = null;
  const e = await api("/expedientes/" + encodeURIComponent(id));
  const h = e.huesped, hecho = (t) => e.tramites[t].estado === "hecho";
  const chips = e.pendientes.length === 0 ? `<span class="chip ok">todo hecho</span>` : "";
  let html = `<section><h2>${esc(e.reserva.nombre)} ${esc(e.reserva.apellidos)} · ${esc(e.referencia)} ${chips}</h2>
    <p class="suave">${esc(e.checkin_prevista)} a ${esc(e.checkout_prevista)} · ${e.personas} persona(s) · ${esc(e.importe)} € · origen: ${esc(e.origen)}${e.viaja_por_trabajo ? " · viaja por trabajo (deducido de las notas)" : ""}</p>
    <ul class="pasos">${Object.keys(NOMBRES).filter((t) => t !== "empresa" || e.viaja_por_trabajo).map((t) =>
      `<li class="chip ${hecho(t) ? "ok" : "aviso"}">${hecho(t) ? "✓" : "○"} ${NOMBRES[t]}</li>`).join("")}</ul></section>`;

  html += `<section><h2>1. Documento y datos del huésped</h2>`;
  if (!hecho("huesped")) {
    html += `<p><label for="foto">Foto del documento (opcional, sin clave se usa una muestra)</label><input id="foto" type="file" accept="image/*"></p>
      <button id="btnOcr" class="primario">Leer documento</button><div id="ocrAviso" class="suave"></div>
      <div id="formH">${formHuesped(h)}</div><div id="errH"></div>
      <button id="btnGuardarH">Confirmar datos del huésped</button>`;
  } else { html += `<p>${esc(h.nombre)} ${esc(h.apellido1)} ${esc(h.apellido2)} · ${esc(h.tipo_documento)} ${esc(h.numero_documento)}</p>`; }
  html += `</section>`;

  html += `<section><h2>2. Pago y empresa</h2>`;
  if (!hecho("pago")) {
    html += `<div class="rejilla"><div><label for="medio">Medio de pago</label><select id="medio">${["", "TARJETA", "TRANSFERENCIA", "EFECTIVO", "PAYPAL", "GIRO"].map((m) => `<option ${e.pago.medio === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
      ${e.viaja_por_trabajo ? `<div><label for="rs">Razón social</label><input id="rs"></div><div><label for="cif">CIF</label><input id="cif"></div><div><label for="dir">Dirección fiscal</label><input id="dir"></div>` : ""}</div>
      <div id="errP"></div><button id="btnGuardarP" ${hecho("huesped") ? "" : "disabled"}>Guardar pago${e.viaja_por_trabajo ? " y empresa" : ""}</button>`;
  } else { html += `<p>${esc(e.pago.medio)}${e.empresa.cif ? " · " + esc(e.empresa.razon_social) + " (" + esc(e.empresa.cif) + ")" : ""}</p>`; }
  html += `</section>`;

  html += `<section><h2>3. Parte de viajeros</h2>`;
  if (hecho("pago") && hecho("huesped")) {
    const p = await api(`/expedientes/${encodeURIComponent(id)}/parte`);
    if (e.parte) {
      html += `<p><span class="chip ok">Enviado (SIMULADO)</span> justificante ${esc(e.parte.justificante)} · ${esc(e.parte.enviado_el)} · ${esc(e.parte.actor)}</p><pre>${esc(e.parte.xml)}</pre>`;
    } else {
      html += (p.faltan.length || p.problemas.length) ? errores(p.faltan.length ? ["Faltan: " + p.faltan.join(", ")] : p.problemas)
        : `<p class="suave">${esc(p.nota)}. Revisa el resumen antes de confirmar: esta acción compromete al hotel.</p><pre>${esc(p.xml)}</pre>
           <button id="btnParte" class="primario">Confirmar y enviar parte</button>
           <div id="confirmaParte" class="alerta aviso" role="alertdialog" aria-label="Confirmar envío" hidden>
             <p>Vas a enviar el parte de viajeros (simulado en la demo). Esta acción compromete legalmente al hotel. ¿Confirmas?</p>
             <button id="btnSi" class="primario">Sí, enviar</button> <button id="btnNo">Cancelar</button></div><div id="errParte"></div>`;
    }
  } else { html += `<p class="suave">Disponible cuando estén los datos del huésped y el pago.</p>`; }
  html += `</section>`;

  if (hecho("huesped")) {
    const o = await api(`/expedientes/${encodeURIComponent(id)}/ofihotel`);
    html += `<section><h2>4. Alta en OfiHotel</h2><p class="suave">OfiHotel no tiene API: es la única salida sin automatizar (${esc(o.modo)}).</p>
      <table><caption>Datos en el orden del formulario</caption>${o.filas.map((f) => `<tr><th scope="row">${esc(f.campo)}</th><td>${esc(f.valor)}</td></tr>`).join("")}</table>
      ${hecho("ofihotel_alta") ? `<p class="chip ok">Alta hecha</p>` : `<p><button data-marca="ofihotel_alta">Marcar alta hecha en OfiHotel</button></p>`}</section>`;
    html += `<section><h2>5. Check-out</h2><ul>${["factura", "habitacion_liberada"].map((t) =>
      `<li>${NOMBRES[t]}: ${hecho(t) ? `<span class="chip ok">hecho</span>` : `<button data-marca="${t}">Marcar hecho</button>`}</li>`).join("")}
      <li>Parte enviado: <span class="chip ${hecho("parte") ? "ok" : "critico"}">${hecho("parte") ? "hecho" : "pendiente"}</span></li></ul>
      <div id="errC"></div>${e.estado === "cerrado" ? `<p class="chip ok">Expediente cerrado</p>` : `<button id="btnCerrar" class="primario">Cerrar expediente</button>`}
      <p class="suave">El sistema no ve lo que pasa dentro de OfiHotel: la factura y la liberación dependen de que recepción las marque.</p></section>`;
  }
  html += `<section><h2>Registro</h2><table><caption class="suave">Quién hizo qué y cuándo</caption>${e.registro.map((r) => `<tr><td>${esc(r.hora.replace("T", " "))}</td><td>${esc(r.actor)}</td><td>${esc(r.accion)}</td></tr>`).join("")}</table></section>`;
  $("#detalle").innerHTML = html;
  enlazar(id);
  pintarPanel();
}

function enlazar(id) {
  const ruta = "/expedientes/" + encodeURIComponent(id);
  const clic = (s, f) => { const el = $(s); if (el) el.onclick = f; };
  clic("#btnOcr", async () => {
    const f = $("#foto").files[0]; let b64 = null;
    if (f) b64 = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(f); });
    lectura = await api(ruta + "/ocr", "POST", { imagen_b64: b64, tipo_mime: f ? f.type : "image/png" });
    const actualH = Object.fromEntries(CAMPOS.map(([c]) => [c, $("#h_" + c).value]));
    const mezcla = { ...lectura.campos, telefono: actualH.telefono, email: actualH.email };
    $("#formH").innerHTML = formHuesped(mezcla, lectura.confianza);
    $("#ocrAviso").innerHTML = `Modo de lectura: ${esc(lectura.modo)}. ${lectura.aviso ? esc(lectura.aviso) + ". " : ""}Campos con poca confianza, marcados para revisar: ${lectura.dudosos.length}.` +
      (lectura.problemas.length ? errores(lectura.problemas) : "");
  });
  clic("#btnGuardarH", async () => {
    const cuerpo = Object.fromEntries(CAMPOS.map(([c]) => [c, $("#h_" + c).value]));
    try { await api(ruta + "/huesped", "PUT", cuerpo); abrir(id); } catch (e) { $("#errH").innerHTML = errores(e); }
  });
  clic("#btnGuardarP", async () => {
    const cuerpo = { medio: $("#medio").value };
    if ($("#rs")) cuerpo.empresa = { razon_social: $("#rs").value, cif: $("#cif").value, direccion: $("#dir").value };
    try { await api(ruta + "/pago", "PUT", cuerpo); abrir(id); } catch (e) { $("#errP").innerHTML = errores(e); }
  });
  clic("#btnParte", () => {
    $("#confirmaParte").hidden = false; $("#btnParte").hidden = true; $("#btnSi").focus();
  });
  clic("#btnNo", () => { $("#confirmaParte").hidden = true; $("#btnParte").hidden = false; });
  clic("#btnSi", async () => {
    try { await api(ruta + "/parte/confirmar", "POST", { actor: "Flor" }); abrir(id); } catch (e) { $("#errParte").innerHTML = errores(e); }
  });
  document.querySelectorAll("[data-marca]").forEach((b) => b.onclick = async () => {
    try { await api(ruta + "/tramites/" + b.dataset.marca, "POST", { actor: "Flor" }); abrir(id); } catch (e) { $("#errC").innerHTML = errores(e); }
  });
  clic("#btnCerrar", async () => {
    try { await api(ruta + "/cerrar", "POST", { actor: "Flor" }); abrir(id); }
    catch (e) { $("#errC").innerHTML = errores(["No se puede cerrar. Falta: " + lista(e).map((t) => NOMBRES[t] || t).join(", ")]); }
  });
}

$("#btnSync").onclick = async () => { await api("/sync/roomcloud", "POST"); pintarPanel(); };
$("#btnOfi").onclick = async () => { await api("/sync/ofihotel", "POST"); pintarPanel(); };
$("#btnWa").onclick = async () => {
  await api("/whatsapp/simular", "POST", { wa_id: $("#wa_id").value, nombre: $("#wa_nombre").value, texto: $("#wa_texto").value });
  pintarPanel();
};
$("#btnWalkin").onclick = async () => {
  const cuerpo = { nombre: $("#w_nombre").value, apellidos: $("#w_apellidos").value, tipo: $("#w_tipo").value,
    checkin: $("#w_in").value, checkout: $("#w_out").value, forzar: $("#w_forzar").checked };
  try {
    const r = await api("/walkin", "POST", cuerpo);
    $("#errW").innerHTML = ""; $("#forzarEtiqueta").hidden = true; $("#w_forzar").checked = false; $("#w_nombre").value = "";
    await pintarPanel(); abrir(r.id);
  } catch (e) {
    if (e.conflicto) {
      $("#errW").innerHTML = errores([`No hay habitaciones ${cuerpo.tipo} libres: ` + e.conflicto.map((c) => `${c.fecha} (${c.ocupadas} para ${c.capacidad})`).join(", ")]);
      $("#forzarEtiqueta").hidden = false;
    } else { $("#errW").innerHTML = errores(e); }
  }
};
const historial = [];
$("#btnChat").onclick = async () => {
  const texto = $("#chatTexto").value.trim(); if (!texto) return;
  const r = await api("/chat", "POST", { mensaje: texto, historial });
  historial.push({ role: "user", content: texto }, { role: "assistant", content: r.respuesta });
  $("#chatLog").innerHTML += `<p><strong>Tú:</strong> ${esc(texto)}</p><p><strong>Asistente:</strong> ${esc(r.respuesta)} <span class="suave">(${esc(r.modo)})</span></p>`;
  $("#chatTexto").value = ""; pintarPanel();
};
$("#btnReloj").onclick = async () => { await api("/reloj", "POST", { horas: 6 }); await pintarPanel(); if (actual) abrir(actual); };
$("#btnReset").onclick = async () => { await api("/reiniciar", "POST"); actual = null; $("#detalle").innerHTML = `<section><p class="suave">Lee las reservas y elige una llegada.</p></section>`; pintarPanel(); };
pintarPanel();
</script>
</body>
</html>
